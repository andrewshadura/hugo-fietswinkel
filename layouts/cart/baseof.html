<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "en" }}">
  {{- partial "head.html" . -}}
  <body>
    {{- partial "preloader.html" . -}}
    {{- partial "header.html" . -}}
    {{- block "main" . }}{{- end }}
    {{- partial "footer.html" . -}}

    <script defer>
    function el_to_id(el) {
      const id = el.dataset.id
      const colour = el.dataset.colour
      const size = el.dataset.size
      return `${id}/${colour}/${size}`
    }
    function updateQuantity(e) {
      const id = el_to_id(e.target)
      const quantity = parseInt(e.target.value, 10)
      if (Number.isNaN(quantity)) {
        const cart = Cart.get()
        if (id in cart) {
          e.target.value = cart[id].quantity
        } else {
          e.target.value = 0
        }
        return
      }
      Cart.update(id, quantity)
    }

    function removeItem(e) {
      const id = el_to_id(e.target)
      Cart.remove(id)
    }

    function updateDeliveryPrice(option) {
      if (!option) {
        return null
      }
      const price = parseFloat(option.dataset.deliveryPrice)
      const basePrice = Number.isFinite(price) ? price : 0
      let deliveryPrice = Math.floor(basePrice * 100)
      const detailsCountry = Cart.deliveryDetails && (Cart.deliveryDetails.zone || Cart.deliveryDetails.country)
      const deliveryCountries = (option.dataset.deliveryCountries || "")
        .split(",")
        .map(country => country.trim())
      const defaultCountry = deliveryCountries[0]
      const countryCode = detailsCountry || defaultCountry
      let weightPrices = {}
      if (option.dataset.deliveryWeightPrices) {
        try {
          weightPrices = JSON.parse(option.dataset.deliveryWeightPrices)
        } catch (error) {
          weightPrices = {}
        }
      }
      const countryKey = countryCode ? countryCode.toLowerCase() : null
      let tiers = []
      if (countryKey && countryKey in weightPrices) {
        tiers = Array.isArray(weightPrices[countryKey]) ? weightPrices[countryKey] : []
      } else if (countryCode && countryCode in weightPrices) {
        tiers = Array.isArray(weightPrices[countryCode]) ? weightPrices[countryCode] : []
      }

      const fixedWeight = parseFloat(option.dataset.deliveryFixedWeight)
      const fixedWeightGrams = Number.isFinite(fixedWeight) ? fixedWeight : 0

      if (tiers.length > 0) {
        const calculatedPrice = Cart.calculateDeliveryPrice(tiers, fixedWeightGrams)
        if (typeof calculatedPrice === "number" && !Number.isNaN(calculatedPrice)) {
          deliveryPrice = calculatedPrice
        }
      }

      const maxPackageWeight = parseFloat(option.dataset.deliveryMaxPackageWeight)
      let eligible = true
      if (Number.isFinite(maxPackageWeight)) {
        const totalWeight = Cart.calculateTotalWeight(fixedWeightGrams)
        eligible = totalWeight <= maxPackageWeight
      }
      option.disabled = !eligible
      const rowElement = document.querySelector(`#cart-summary #shipping-${option.value}-row`)
      if (rowElement) {
        rowElement.style.display = eligible ? "" : "none"
      }

      const optionPriceElement = document.querySelector(`#cart-summary #shipping-${option.value}-price`)
      if (optionPriceElement) {
        const currentPrice = parseInt(optionPriceElement.dataset.price, 10)
        if (currentPrice !== deliveryPrice) {
          optionPriceElement.innerHTML = Cart.currencyFormat.format(deliveryPrice / 100)
          optionPriceElement.dataset.price = deliveryPrice
        }
      }

      return deliveryPrice
    }

    function recalculateSelectedDelivery(option) {
      const selectedOption = option || document.querySelector("#cart-summary input[name=delivery]:checked")
      if (!selectedOption) {
        return
      }

      const previousDeliveryType = Cart.deliveryType

      const deliveryPrice = updateDeliveryPrice(selectedOption)
      if (typeof deliveryPrice === "number" && !Number.isNaN(deliveryPrice)) {
        Cart.deliveryPrice = deliveryPrice
      }
      Cart.deliveryType = selectedOption.value

      const totalElement = document.querySelector("#cart-summary .cart-total")
      totalElement.innerHTML = Cart.currencyFormat.format(Cart.total() / 100)

      const priceElement = document.querySelector("#cart-summary .cart-delivery-total")
      priceElement.innerHTML = Cart.currencyFormat.format(Cart.deliveryPrice / 100)

      const checkoutButton = document.querySelector("#cart-checkout")
      if (checkoutButton) {
        priceElement.innerHTML = Cart.currencyFormat.format(Cart.deliveryPrice / 100)
        const detailsRequired = selectedOption.dataset.deliveryDetailsRequired
        if (detailsRequired == "true") {
          const detailsElement = document.querySelector(`#cart-summary .cart-delivery-details[name=${selectedOption.value}-delivery-details]`)
          if (detailsElement) {
            // The shipping fieldset gets fully re-rendered on every cart mutation, wiping this
            // hidden input back to empty even though Cart.deliveryDetails (a plain JS object)
            // survives. If the details we already have genuinely belong to this same option
            // (same delivery type as before this re-render), restore them instead of forcing
            // the customer to re-pick.
            if (detailsElement.value == "" && previousDeliveryType === selectedOption.value &&
                Cart.deliveryDetails && Object.keys(Cart.deliveryDetails).length > 0) {
              detailsElement.value = JSON.stringify(Cart.deliveryDetails)
            }
            checkoutButton.disabled = detailsElement.value == ""
          }
        } else {
          checkoutButton.disabled = false
        }
      }
    }

    function selectDelivery(e) {
      if (!e.target.checked) {
        return
      }
      recalculateSelectedDelivery(e.target)
    }

    function updateDeliveryPrices() {
      const deliveryOptions = document.querySelectorAll("#cart-summary input[name=delivery]")
      deliveryOptions.forEach(option => updateDeliveryPrice(option))

      // If the currently-selected option just became ineligible (e.g. a heavy item was added
      // while an envelope-style, weight-capped option was selected), fall back to the first
      // still-eligible option in config order instead of leaving a disabled, hidden option
      // checked.
      const checkedOption = document.querySelector("#cart-summary input[name=delivery]:checked")
      if (!checkedOption || checkedOption.disabled) {
        const fallback = Array.from(deliveryOptions).find(option => !option.disabled)
        if (fallback) {
          fallback.checked = true
        }
      }

      recalculateSelectedDelivery()
    }

    document.addEventListener("DOMContentLoaded", updateDeliveryPrices())

    function performCheckout() {
      const checkboxContainer = document.getElementById('cart-checkout-checkboxes')
      if (checkboxContainer) {
        const requiredBoxes = checkboxContainer.querySelectorAll('.required-checkbox')
        for (const box of requiredBoxes) {
          if (!box.reportValidity()) {
            box.scrollIntoView({behavior: 'smooth', block: 'center'})
            return
          }
        }
      }

      const cart = Cart.get()

      const line_items = Object.values(cart).map(item => ({
          price_data: {
              currency: Cart.currency.toLowerCase(),
              product_data: {
                  name: [item.item.name, item.item.colour_label, item.item.size].filter((x) => (x !== undefined && x !== null && x !== "")).join(' / '),
                  description: item.item.description || '\xA0',
                  images: [item.item.image],
                  metadata: item.item,
              },
              unit_amount: item.item.price,
              tax_behavior: 'inclusive',
          },
          quantity: item.quantity,
      }))
      const form = document.createElement('form')
      {{- with (site.Params.CheckoutURL) }}
      form.action = "{{ . }}"
      {{- else }}
      {{ $baseUrl := urls.Parse (site.BaseURL) }}
      form.action = "https://checkout.{{ $baseUrl.Host }}/checkout"
      {{- end }}
      form.method = "POST"
      form.style = "display: none"

      const input = document.createElement('input')
      input.name = 'cart'
      input.value = JSON.stringify(line_items)
      form.appendChild(input)

      const deliveryInput = document.createElement('input')
      deliveryInput.name = 'delivery_details'
      deliveryInput.value = JSON.stringify(Cart.deliveryDetails)
      form.appendChild(deliveryInput)

      const deliveryTypeInput = document.createElement('input')
      deliveryTypeInput.name = 'delivery_type'
      deliveryTypeInput.value = Cart.deliveryType
      form.appendChild(deliveryTypeInput)

      const deliveryPriceInput = document.createElement('input')
      deliveryPriceInput.name = 'delivery_price'
      deliveryPriceInput.value = Cart.deliveryPrice
      form.appendChild(deliveryPriceInput)

      if (checkboxContainer) {
        checkboxContainer.querySelectorAll('input[type="checkbox"]').forEach(box => {
          const fieldInput = document.createElement('input')
          fieldInput.name = 'checkbox_' + box.id.replace('checkout-cb-', '')
          fieldInput.value = box.checked
          form.appendChild(fieldInput)
        })
      }

      document.body.appendChild(form)
      form.submit()
    }

    </script>

  </body>
</html>
